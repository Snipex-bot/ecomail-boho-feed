name: Update Ecomail feed

on:
  schedule:
    - cron: "17 3 * * *"   # denně ~4:17 SEČ
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate feed
        env:
          FEED_URL: ${{ secrets.FEED_URL }}   # URL Heureka feedu e-shopu
        run: python3 generate.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add feed.xml source/heureka.xml
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%F)"
          git push
